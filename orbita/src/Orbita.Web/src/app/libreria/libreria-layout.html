<div class="libreria">
  <header class="barra">
    <span class="marca">ORBITA</span>
    <nav class="nav" aria-label="Navegación">
      @for (estanteria of estanterias; track estanteria.id) {
        <a
          class="nav-enlace"
          [routerLink]="['/', estanteria.id]"
          routerLinkActive="activa"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          {{ estanteria.nombre }}
        </a>
      }
      <a
        class="nav-enlace nav-icono"
        routerLink="/copia-seguridad"
        routerLinkActive="activa"
        aria-label="Copia de seguridad"
        data-tooltip="Copia de seguridad"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M4 14v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5" />
          <path d="M12 3v11M7.5 9.5 12 14l4.5-4.5" />
        </svg>
      </a>
    </nav>
  </header>

  <main class="contenido">
    <router-outlet />
  </main>
</div>
